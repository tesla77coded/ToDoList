openapi: 3.0.3
info:
  title: TodoList API
  version: 1.0.0
  description: |
    REST API for a full-featured Todo application:
    - Supabase PostgreSQL database
    - Redis (Upstash) caching
    - Email notifications
    - Image & audio uploads
    - JWT authentication with admin features.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: jay }
        email: { type: string, example: jay@example.com }
        is_admin: { type: boolean, example: false }
    Task:
      type: object
      properties:
        id: { type: integer, example: 42 }
        user_id: { type: integer, example: 1 }
        title: { type: string, example: Buy groceries }
        description: { type: string, nullable: true }
        is_completed: { type: boolean, example: false }
        image_url: { type: string, format: uri, nullable: true }
        audio_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    Notification:
      type: object
      properties:
        id: { type: integer, example: 10 }
        user_id: { type: integer, example: 1 }
        message: { type: string, example: 'Your profile was updated by an admin.' }
        created_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        stack: { type: string, nullable: true }
    PaginatedTasks:
      type: object
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        nextCursor: { type: [string, 'null'], example: '2025-09-20T10:20:30.000Z' }
        totalTasks: { type: integer, example: 37 }
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, example: 'jay or jay@example.com' }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        name: { type: string, example: jay }
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR... }
    UpdateProfileRequest:
      type: object
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    UpdateUserByAdminRequest:
      type: object
      properties:
        username: { type: string }
        email: { type: string, format: email }
        isAdmin: { type: boolean }
    CreateTaskForm:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        image: { type: string, format: binary }
        audio: { type: string, format: binary }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        is_completed: { type: boolean }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, format: password }

security:
  - bearerAuth: []

paths:
  /users:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: User registered; email confirmation sent }
        '400': { description: User already exists }
  /users/confirm-email:
    get:
      summary: Confirm email with token
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Email verified successfully }
        '400': { description: Invalid or expired token }
        '404': { description: User not found }
  /users/forgot-password:
    post:
      summary: Send password reset email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200': { description: Reset link sent }
        '404': { description: User not registered }
  /users/reset-password:
    post:
      summary: Reset password using token
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset successfully }
        '400': { description: Invalid or expired token }
  /users/login:
    post:
      summary: Login (email or username + password)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { description: Invalid credentials or email not verified }
        '404': { description: User not found }
  /users/profile:
    get:
      summary: Get current user's profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthorized }
  /users/update-profile:
    put:
      summary: Update current user's profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: Updated profile (new JWT issued) }
        '401': { description: Unauthorized }
  /users/user-notifications:
    get:
      summary: Get current user's notifications
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        '401': { description: Unauthorized }
  /users/allUserProfiles:
    get:
      summary: Get all users (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthorized }
        '403': { description: Admin access only }
  /users/{id}:
    put:
      summary: Update a user by id (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserByAdminRequest' }
      responses:
        '200': { description: Updated; new JWT included }
        '401': { description: Unauthorized }
        '403': { description: Admin access only }
        '404': { description: User not found }
    delete:
      summary: Delete a user by id (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted }
        '400': { description: Admins cannot delete their own account }
        '401': { description: Unauthorized }
        '403': { description: Admin access only }
        '404': { description: User not found }
  /tasks/create-task:
    post:
      summary: Create a task (with optional image/audio)
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CreateTaskForm' }
      responses:
        '201': { description: Task created }
        '400': { description: Task must have at least title or description }
        '401': { description: Unauthorized }
  /tasks:
    get:
      summary: List current user's tasks (cursor pagination)
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 5 }
        - in: query
          name: sort
          schema: { type: string, enum: [created, title], default: created }
      responses:
        '200':
          description: Paginated tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedTasks' }
        '401': { description: Unauthorized }
  /tasks/{id}:
    put:
      summary: Update a task by id
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { description: Unauthorized }
        '404': { description: Task not found }
    delete:
      summary: Delete a task by id
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Task not found }
  /tasks/search:
    get:
      summary: Search current user's tasks by title/description (cursor pagination)
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 5 }
        - in: query
          name: sort
          schema: { type: string, enum: [created, title], default: created }
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  nextCursor: { type: [string,'null'] }
        '400': { description: Search query is required }
        '401': { description: Unauthorized }
  /tasks/admin/getalltasks:
    get:
      summary: Get all tasks (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 5 }
        - in: query
          name: sort
          schema: { type: string, enum: [created, title], default: created }
      responses:
        '200': { description: Paginated tasks (all users) }
        '401': { description: Unauthorized }
        '403': { description: Admin access only }
  /tasks/admin/delete-task/{id}:
    delete:
      summary: Delete a task by id (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted; user notified + email sent if possible }
        '401': { description: Unauthorized }
        '403': { description: Admin access only }
        '404': { description: Task not found }
